name: Testes da API gestão de alunos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '44 7 * * 5'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/nova-gestao-de-alunos-test
      BASE_URL: http://127.0.0.1:3000
      ADMIN_EMAIL: admin@escola.com
      ADMIN_SENHA: admin123
      ALUNO_EMAIL: junior.alcala@example.com
      ALUNO_SENHA: 123456

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar API
        run: |
          npm start > server.log 2>&1 &
          for tentativa in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done

      - name: Executar testes
        run: npm test
